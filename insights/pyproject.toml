[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot-insights"
version = "0.1.0"
description = "Analytics pipeline, learner model and personalization service for Polybot"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openpyxl>=3.1",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["polybot_insights*"]

[tool.setuptools.package-data]
polybot_insights = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
